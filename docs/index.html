<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MinePainter</title>
<meta name="description" content="MinePainter：你用什麼軟體做縮圖？我：黃金荷包蛋。" />
<!-- 貼到 Discord／社群時的預覽卡：小圖示在右邊（summary），側邊條用主題金色 -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="MinePainter" />
<meta property="og:title" content="MinePainter" />
<meta property="og:description" content="最強縮圖軟體為什麼是一顆荷包蛋？我也不知道......" />
<meta property="og:url" content="https://dragonl0508.github.io/minepainter/" />
<meta property="og:image" content="https://dragonl0508.github.io/minepainter/og-icon.png" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta property="og:image:alt" content="MinePainter 圖示：黃金荷包蛋" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="MinePainter" />
<meta name="twitter:description" content="最強縮圖軟體為什麼是一顆荷包蛋？我也不知道......" />
<meta name="twitter:image" content="https://dragonl0508.github.io/minepainter/og-icon.png" />
<meta name="theme-color" content="#f4c22a" />
<link rel="icon" href="icon.png" />
<style>
  /* 標題字型只切出 ASCII 子集（標題是英文），檔案 2 KB */
  @font-face {
    font-family: "Nightgazer";
    src: url(nightgazer.woff2) format("woff2");
    font-display: block;
  }
  :root {
    color-scheme: dark;
    --bg: #131316;
    --card: #17171b;
    --line: #24242b;
    --line-soft: #212128;
    --text: #e8e8ee;
    --muted: #9a9aa8;
    --faint: #55555f;
    --accent: #f4c22a;
    --accent-ink: #1a1a1f;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  /* 「更多」點下去是滑過去，不是跳過去 */
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* ---- 第一頁：下載 ---- */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  /* 背景是 app 的實際截圖（已模糊、壓暗、上下淡進底色），下載按鈕與文字疊在上面還要看得清楚 */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url(hero-bg.webp) center / cover no-repeat var(--bg);
    opacity: 0;
    animation: bg-in 1.6s var(--ease) .2s forwards;
    pointer-events: none;
  }
  @keyframes bg-in { to { opacity: 1; } }
  .ripple { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  .hero.gl .ripple { opacity: 1; }
  .hero.gl::before { animation: none; opacity: 0; transition: opacity 1.2s ease .3s; }
  .hero-inner { position: relative; width: 100%; max-width: 520px; }
  .halo {
    position: absolute;
    width: 520px; height: 520px;
    top: 50%; left: 50%;
    margin: -300px 0 0 -260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,194,42,.22) 0%, rgba(244,194,42,0) 65%);
    pointer-events: none;
    opacity: .35;
    animation: glow 5s ease-in-out infinite 1s;
  }
  .icon-wrap { animation: float 5s ease-in-out infinite 1s; margin-bottom: 40px; }
  .icon { width: 128px; height: 128px; image-rendering: pixelated; display: block; margin: 0 auto; }
  h1 {
    margin: 0 0 18px;
    font: 400 48px/1.1 "Nightgazer", "Segoe UI", system-ui, sans-serif;
    letter-spacing: 1px;
  }
  .tagline { margin: 0 0 48px; font-size: 19px; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 17px; font-weight: 700; text-decoration: none;
    padding: 16px 30px; border-radius: 999px;
    transition: transform .35s var(--ease), box-shadow .35s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 44px -4px rgba(244,194,42,.5); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn svg { transition: transform .35s var(--ease); }
  .btn:hover svg { transform: translateY(3px); }
  .meta { margin-top: 22px; font-size: 13px; color: var(--faint); letter-spacing: .2px; min-height: 1.6em; }
  /* 累計下載次數：跟 meta 同一級的小字，查不到就整行不出現 */
  .tally {
    margin-top: 10px; font-size: 13px; color: var(--faint); letter-spacing: .2px;
    opacity: 0; transition: opacity .6s var(--ease);
  }
  .tally.in { opacity: 1; }
  .tally b { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 右上角的外部連結：純色單色圖示，捲動時跟著留在原位 */
  .corner {
    position: fixed; top: 20px; right: 24px; z-index: 5;
    display: flex; align-items: center; gap: 16px;
  }
  .corner a {
    display: block; color: var(--faint);
    transition: color .3s ease, transform .3s var(--ease);
  }
  .corner a:hover { color: var(--text); transform: translateY(-2px); }
  .corner svg { display: block; }

  /* 往下還有一頁的提示；捲動後自己退場 */
  .cue {
    /* 用 left/right + margin 置中，不用 translateX(-50%)：它掛著 rise 動畫，
       動畫結束會把 transform 覆寫成 translateY(0)，置中就掉了（使用者 2026-09-06 回報「更多沒置中」） */
    position: absolute; left: 0; right: 0; bottom: 28px; width: max-content; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: 1.5px; color: var(--faint);
    text-decoration: none;
    transition: opacity .4s ease, color .3s ease;
  }
  .cue:hover { color: var(--muted); }
  .cue svg { animation: nudge 2.4s ease-in-out infinite; }
  body.scrolled .cue { opacity: 0; pointer-events: none; }

  /* ---- 第二頁 ---- */
  .why {
    max-width: 1100px;
    margin: 0 auto;
    /* 佔滿一屏、內容垂直置中：從「更多」滑下來剛好是一整頁 WHY，
       底下那排截圖完整留在下一屏，不會被切一半露出上半截 */
    min-height: 100vh;
    min-height: 100dvh;
    padding: 120px 24px 140px;
    display: grid;
    grid-template-columns: minmax(400px, 9fr) minmax(0, 13fr);
    gap: 72px;
    align-items: center;
    align-content: center;
  }
  .why { max-width: 1440px; }
  .eyebrow {
    font: 400 13px/1 "Nightgazer", "Segoe UI", system-ui, sans-serif;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .why h2 {
    margin: 28px 0 0;
    font-size: 36px; line-height: 1.3; font-weight: 700; white-space: nowrap;
  }
  .why-note { margin: 28px 0 0; font-size: 15px; line-height: 1.8; color: var(--faint); }
  .list { list-style: none; margin: 40px 0 0; padding: 0; }
  .list li {
    display: grid;
    grid-template-columns: 48px 76px minmax(0, 1fr);
    align-items: baseline;
    padding: 18px 12px 18px 0;
    border-top: 1px solid var(--line);
  }
  .list li:last-child { border-bottom: 1px solid var(--line); }
  .list i {
    font: 400 14px/1 "Nightgazer", "Segoe UI", system-ui, sans-serif;
    font-style: normal; color: var(--accent);
  }
  .list b { font-size: 18px; font-weight: 700; }
  .list span { font-size: 16px; color: var(--muted); }

  /* ---- 舞台：三張截圖疊成一疊透視卡片，最前面那張清楚、後面兩張退後變淡 ---- */
  .stage {
    position: relative;
    aspect-ratio: 1920 / 1058;
    perspective: 1600px;
    perspective-origin: 30% 50%;
    margin: 0 8% 12% 0;   /* 後面兩張往右下退，留位子 */
  }
  .stage::before {
    /* 卡片背後一團很淡的暖光，把它從底色托出來 */
    content: ""; position: absolute; inset: -10% -6% 0 -6%;
    background: radial-gradient(ellipse at 45% 55%, rgba(244,194,42,.13), rgba(244,194,42,0) 62%);
    filter: blur(20px); pointer-events: none;
  }
  .card {
    position: absolute; inset: 0;
    margin: 0;
    border-radius: 12px; overflow: hidden;
    border: 1px solid #2c2c35;
    background: var(--card);
    box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
    transform-origin: 50% 50%;
    transition: transform 1s var(--ease), opacity .8s ease, filter .8s ease, box-shadow 1s var(--ease);
    will-change: transform;
    cursor: zoom-in;
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* 三個位子：0 最前、1 中、2 最後；哪張卡在哪個位子由 data-pos 決定 */
  .card[data-pos="0"] { z-index: 3; opacity: 1; filter: none;
    transform: rotateY(-9deg) rotateX(2.5deg) translate3d(0, 0, 0); }
  .card[data-pos="1"] { z-index: 2; opacity: .85; filter: brightness(.72) saturate(.85);
    transform: rotateY(-9deg) rotateX(2.5deg) translate3d(6.5%, 8%, -120px) scale(.95); pointer-events: none; }
  .card[data-pos="2"] { z-index: 1; opacity: .6; filter: brightness(.55) saturate(.7);
    transform: rotateY(-9deg) rotateX(2.5deg) translate3d(13%, 16%, -240px) scale(.9); pointer-events: none; }
  .stage:hover .card[data-pos="0"] { transform: rotateY(-4deg) rotateX(1deg) translate3d(0, -4px, 20px); box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  /* 右邊一顆小箭頭：點了換下一張 */
  .next {
    position: absolute; right: -14%; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: rgba(23,23,27,.85); color: var(--muted);
    cursor: pointer; z-index: 4;
    transition: color .3s ease, border-color .3s ease, background .3s ease, transform .35s var(--ease);
  }
  .next:hover { color: var(--text); border-color: #3a3a44; background: var(--card); transform: translateY(-50%) translateX(3px); }
  .next:active { transform: translateY(-50%) scale(.94); }
  .next svg { display: block; }
  /* 舞台自己也是捲到才浮現，位移大一點 */
  .stage.reveal { transform: translateY(40px); transition-duration: 1s; }
  .stage.reveal.in { transform: none; }

  /* 點開放大：dialog 從 96% 帶淡入放到定位；關的時候倒著跑完再真的 close */
  .lightbox { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1600px); max-height: 96vh; overflow: visible; }
  .lightbox::backdrop { background: rgba(0,0,0,.84); backdrop-filter: blur(8px); }
  .lightbox img {
    display: block; max-width: min(96vw, 1600px); max-height: 94vh; width: auto; height: auto;
    border-radius: 10px; border: 1px solid var(--line); cursor: zoom-out;
    box-shadow: 0 40px 100px rgba(0,0,0,.6);
  }
  .lightbox[open] { animation: box-in .45s var(--ease) both; }
  .lightbox[open]::backdrop { animation: fade-in .45s ease both; }
  .lightbox.closing { animation: box-out .3s var(--ease) both; }
  .lightbox.closing::backdrop { animation: fade-out .3s ease both; }
  @keyframes box-in { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes box-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(8px) scale(.97); } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

  /* 依序淡入上浮 */
  .rise { animation: rise .9s var(--ease) both; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; }
  .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; } .d5 { animation-delay: .9s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes glow { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.12); } }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  /* 捲到才浮現（第二頁的內容） */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 860px) {
  }
  @media (max-width: 1100px) {
    .why { grid-template-columns: 1fr; gap: 56px; padding: 96px 24px 120px; min-height: 0; }
    .stage { max-width: 720px; margin: 0 auto 10%; }
    .next { right: -8px; }
  }
  @media (max-width: 860px) {
    .why { grid-template-columns: 1fr; gap: 48px; padding: 96px 24px 120px; }
    .why h2 { font-size: 30px; white-space: normal; }
  }
  @media (max-width: 480px) {
    .corner { top: 14px; right: 16px; gap: 14px; }
    .icon { width: 104px; height: 104px; }
    .icon-wrap { margin-bottom: 32px; }
    h1 { font-size: 36px; }
    .tagline { font-size: 16px; margin-bottom: 40px; }
    .btn { width: 100%; justify-content: center; }
    .halo { width: 360px; height: 360px; margin: -220px 0 0 -180px; }
    .why { padding: 72px 20px 96px; }
    .why h2 { font-size: 26px; }
    .list li { grid-template-columns: 44px 72px minmax(0, 1fr); padding: 20px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rise, .icon-wrap, .halo, .cue svg { animation: none; }
    .hero::before { animation: none; opacity: 1; }
    .btn, .btn svg { transition: none; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .card, .next { transition: none; }
    .lightbox[open], .lightbox[open]::backdrop, .lightbox.closing, .lightbox.closing::backdrop { animation: none; }
    .tally { transition: none; }
    .corner a { transition: none; }
    .corner a:hover { transform: none; }
  }
</style>
</head>
<body>
<nav class="corner rise d5" aria-label="連結">
  <a href="https://github.com/DragonL0508/minepainter" title="GitHub" aria-label="GitHub">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.66-.21-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.54-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.27-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
  </a>
  <a href="https://github.com/DragonL0508/minepainter/releases" title="所有版本" aria-label="所有版本">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
  </a>
</nav>
<main>
  <section class="hero">
    <!-- 水波：WebGL 接手背景（見 ripple.js）；跑不起來就維持 ::before 的靜態圖 -->
    <canvas class="ripple" id="ripple" aria-hidden="true"></canvas>
    <div class="halo" aria-hidden="true"></div>

    <div class="hero-inner">
      <div class="rise"><div class="icon-wrap"><img class="icon" src="icon.png" alt="" width="128" height="128" /></div></div>
      <h1 class="rise d1">MinePainter</h1>
      <p class="tagline rise d2">你用什麼軟體做縮圖？我：黃金荷包蛋。</p>

      <a class="btn rise d3" id="download" href="https://github.com/DragonL0508/minepainter/releases/latest">
        <span>下載 Windows 版</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v13"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>
      </a>
      <div class="meta rise d4" id="meta"></div>
      <div class="tally" id="tally" hidden>累計下載 <b id="tally-num">0</b> 次</div>
    </div>

    <a class="cue rise d5" href="#why">
      <span>更多</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </a>
  </section>

  <section class="why" id="why">
    <div class="why-text">
      <div class="reveal">
        <div class="eyebrow">WHY</div>
        <h2>就像是熟悉的 paint.net。<br />但多了這些...</h2>
        <p class="why-note">為了縮圖製作者而煎的一顆荷包蛋。</p>
      </div>
      <ul class="list" id="list">
        <li class="reveal"><i>01</i><b>快速</b><span>優化使用流程，省去多餘時間</span></li>
        <li class="reveal"><i>02</i><b>效能</b><span>開得更快，隨時隨地想做就做</span></li>
        <li class="reveal"><i>03</i><b>介面</b><span>現代設計，動畫絲滑流暢</span></li>
        <li class="reveal"><i>04</i><b>可塑</b><span>特效再也不烙死在圖層，隨時能改先前的設計</span></li>
        <li class="reveal"><i>05</i><b>功能</b><span>更多功能，創作不再受限</span></li>
        <li class="reveal"><i>06</i><b>安裝</b><span>解壓就能跑，開源免費（MIT）</span></li>
      </ul>
    </div>
    <div class="stage reveal" id="stage" data-delay="120" aria-label="App 內截圖">
      <figure class="card" data-pos="0" data-full="shot-focus.webp">
        <img src="shot-focus-s.webp" alt="MinePainter 的聚焦效果對話框" width="1200" height="661" loading="lazy" decoding="async" />
      </figure>
      <figure class="card" data-pos="1" data-full="shot-text.webp">
        <img src="shot-text-s.webp" alt="MinePainter 編輯帶效果的文字物件" width="1200" height="661" loading="lazy" decoding="async" />
      </figure>
      <figure class="card" data-pos="2" data-full="shot-select.webp">
        <img src="shot-select-s.webp" alt="MinePainter 的物件選取與筆刷" width="1200" height="661" loading="lazy" decoding="async" />
      </figure>
      <button class="next" id="next" type="button" aria-label="下一張">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </section>

</main>

<dialog class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="" />
</dialog>

<script>
// 下載連結直接指向「最新的 Release」附件：發一版 Release 這頁就跟著更新，不必改網頁。
// 累計下載次數也是同一份資料算出來的：GitHub 每個 Release 附件都有 download_count，全部加總。
(async () => {
  const repo = 'DragonL0508/minepainter';
  const size = b => (b / 1048576).toFixed(0) + ' MB';
  try {
    // 一次把所有 Release 抓回來（每頁 100 筆，抓到不滿一頁就停）
    const rels = [];
    for (let page = 1; page <= 5; page++) {
      const res = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=100&page=${page}`);
      if (!res.ok) throw new Error(res.status);
      const batch = await res.json();
      rels.push(...batch);
      if (batch.length < 100) break;
    }

    const downloads = r => (r.assets || []).reduce((n, a) => n + (a.download_count || 0), 0);

    // 最新的正式版（跳過草稿與預覽版），跟 releases/latest 是同一個
    const rel = rels.find(r => !r.draft && !r.prerelease);
    if (rel) {
      const sc = (rel.assets || []).find(a => /win-x64\.zip$/i.test(a.name));
      if (sc) document.getElementById('download').href = sc.browser_download_url;
      const date = new Date(rel.published_at).toLocaleDateString('zh-TW');
      document.getElementById('meta').textContent = [rel.tag_name, sc && size(sc.size), `${date} 更新`].filter(Boolean).join(' · ');
    }

    const total = rels.filter(r => !r.draft).reduce((n, r) => n + downloads(r), 0);
    if (total > 0) countUp(document.getElementById('tally'), document.getElementById('tally-num'), total);
  } catch {
    // 查不到（沒發過 Release、API 額度用完、離線…）就維持指向 releases/latest 的保底連結，
    // 累計次數那行也保持隱藏，寧可不顯示也不要顯示錯的數字
  }
})();

// 數字從 0 跑到 total；關掉動畫的人直接看到結果。
function countUp(row, out, total) {
  const fmt = n => n.toLocaleString('zh-TW');
  row.hidden = false;
  requestAnimationFrame(() => row.classList.add('in'));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    out.textContent = fmt(total);
    return;
  }
  const ms = 900, t0 = performance.now();
  const tick = now => {
    const k = Math.min((now - t0) / ms, 1);
    out.textContent = fmt(Math.round(total * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// 第二頁的內容捲到才浮現；不支援 IntersectionObserver（或使用者關掉動畫）就直接顯示。
(() => {
  const items = document.querySelectorAll('.reveal');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still || !('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px' });
    items.forEach((el, i) => {
      el.style.transitionDelay = `${el.dataset.delay ?? Math.min(i, 6) * 60}ms`;
      io.observe(el);
    });
  }

  // 截圖點開放大（原生 dialog；點圖或背景、Esc 都關）
  const box = document.getElementById('lightbox');
  if (box && typeof box.showModal === 'function') {
    const img = document.getElementById('lightbox-img');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 大圖先預載，點開才不會先看到一張空的再跳出來
    document.querySelectorAll('.card').forEach(fig => {
      const pre = new Image(); pre.src = fig.dataset.full;
      fig.addEventListener('click', () => {
        if (fig.dataset.pos !== '0') return; // 只有最前面那張點得開
        img.src = fig.dataset.full;
        img.alt = fig.querySelector('img').alt;
        box.classList.remove('closing');
        box.showModal();
      });
    });
    // 關：先跑退場動畫再 close（dialog 原生 close 是瞬間消失）
    const dismiss = () => {
      if (box.classList.contains('closing')) return;
      if (still) { box.close(); return; }
      box.classList.add('closing');
      box.addEventListener('animationend', () => { box.classList.remove('closing'); box.close(); }, { once: true });
    };
    box.addEventListener('click', dismiss);
    box.addEventListener('cancel', e => { e.preventDefault(); dismiss(); }); // Esc 也走退場
    box.addEventListener('close', () => { img.src = ''; });
  }

  // 舞台：點右邊的箭頭，下一張滑到最前面
  (() => {
    const cards = [...document.querySelectorAll('#stage .card')];
    const next = document.getElementById('next');
    if (cards.length !== 3 || !next) return;
    let front = 0;
    next.addEventListener('click', () => {
      front = (front + 1) % 3;
      cards.forEach((c, k) => { c.dataset.pos = String((k - front + 3) % 3); });
    });
  })();

  // 捲一下就把「憑什麼」的提示收起來
  const onScroll = () => document.body.classList.toggle('scrolled', scrollY > 40);
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
<script src="ripple.js" defer></script>
</body>
</html>
