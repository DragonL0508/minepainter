<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MinePainter</title>
<meta name="description" content="MinePainter：你用什麼軟體做縮圖？我：黃金荷包蛋。" />
<link rel="icon" href="icon.png" />
<style>
  /* 標題字型只切出 ASCII 子集（標題是英文），檔案 2 KB */
  @font-face {
    font-family: "Nightgazer";
    src: url(nightgazer.woff2) format("woff2");
    font-display: block;
  }
  :root {
    color-scheme: dark;
    --bg: #131316;
    --card: #17171b;
    --line: #24242b;
    --line-soft: #212128;
    --text: #e8e8ee;
    --muted: #9a9aa8;
    --faint: #55555f;
    --accent: #f4c22a;
    --accent-ink: #1a1a1f;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* ---- 第一頁：下載 ---- */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .hero-inner { position: relative; width: 100%; max-width: 520px; }
  .halo {
    position: absolute;
    width: 520px; height: 520px;
    top: 50%; left: 50%;
    margin: -300px 0 0 -260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,194,42,.22) 0%, rgba(244,194,42,0) 65%);
    pointer-events: none;
    animation: glow 5s ease-in-out infinite 1s;
  }
  .icon-wrap { animation: float 5s ease-in-out infinite 1s; margin-bottom: 40px; }
  .icon { width: 128px; height: 128px; image-rendering: pixelated; display: block; margin: 0 auto; }
  h1 {
    margin: 0 0 18px;
    font: 400 48px/1.1 "Nightgazer", "Segoe UI", system-ui, sans-serif;
    letter-spacing: 1px;
  }
  .tagline { margin: 0 0 48px; font-size: 19px; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 17px; font-weight: 700; text-decoration: none;
    padding: 16px 30px; border-radius: 999px;
    transition: transform .35s var(--ease), box-shadow .35s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 44px -4px rgba(244,194,42,.5); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn svg { transition: transform .35s var(--ease); }
  .btn:hover svg { transform: translateY(3px); }
  .meta { margin-top: 22px; font-size: 13px; color: var(--faint); letter-spacing: .2px; min-height: 1.6em; }
  .links { margin-top: 56px; font-size: 13px; color: var(--faint); }
  .links a { color: var(--faint); text-decoration: none; transition: color .3s ease; }
  .links a:hover { color: var(--text); }

  /* 往下還有一頁的提示；捲動後自己退場 */
  .cue {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: 1.5px; color: var(--faint);
    text-decoration: none;
    transition: opacity .4s ease, color .3s ease;
  }
  .cue:hover { color: var(--muted); }
  .cue svg { animation: nudge 2.4s ease-in-out infinite; }
  body.scrolled .cue { opacity: 0; pointer-events: none; }

  /* ---- 第二頁 ---- */
  .why {
    max-width: 1100px;
    margin: 0 auto;
    padding: 160px 24px 180px;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    gap: 72px;
    align-items: start;
  }
  .eyebrow {
    font: 400 13px/1 "Nightgazer", "Segoe UI", system-ui, sans-serif;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .why h2 {
    margin: 28px 0 0;
    font-size: 40px; line-height: 1.3; font-weight: 700;
  }
  .why-note { margin: 28px 0 0; font-size: 15px; line-height: 1.8; color: var(--faint); }
  .list { list-style: none; margin: 0; padding: 10px 0 0; }
  .list li {
    display: grid;
    grid-template-columns: 56px 88px minmax(0, 1fr);
    align-items: baseline;
    padding: 26px 0;
    border-top: 1px solid var(--line);
  }
  .list li:last-child { border-bottom: 1px solid var(--line); }
  .list i {
    font: 400 14px/1 "Nightgazer", "Segoe UI", system-ui, sans-serif;
    font-style: normal; color: var(--accent);
  }
  .list b { font-size: 18px; font-weight: 700; }
  .list span { font-size: 17px; color: var(--muted); }

  /* 依序淡入上浮 */
  .rise { animation: rise .9s var(--ease) both; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; }
  .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; } .d5 { animation-delay: .9s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes glow { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.12); } }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  /* 捲到才浮現（第二頁的內容） */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 860px) {
  }
  @media (max-width: 860px) {
    .why { grid-template-columns: 1fr; gap: 48px; padding: 96px 24px 120px; }
    .why h2 { font-size: 30px; }
  }
  @media (max-width: 480px) {
    .icon { width: 104px; height: 104px; }
    .icon-wrap { margin-bottom: 32px; }
    h1 { font-size: 36px; }
    .tagline { font-size: 16px; margin-bottom: 40px; }
    .btn { width: 100%; justify-content: center; }
    .halo { width: 360px; height: 360px; margin: -220px 0 0 -180px; }
    .why { padding: 72px 20px 96px; }
    .why h2 { font-size: 26px; }
    .list li { grid-template-columns: 44px 72px minmax(0, 1fr); padding: 20px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .icon-wrap, .halo, .cue svg { animation: none; }
    .btn, .btn svg { transition: none; }
    .reveal { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="halo" aria-hidden="true"></div>

    <div class="hero-inner">
      <div class="rise"><div class="icon-wrap"><img class="icon" src="icon.png" alt="" width="128" height="128" /></div></div>
      <h1 class="rise d1">MinePainter</h1>
      <p class="tagline rise d2">你用什麼軟體做縮圖？我：黃金荷包蛋。</p>

      <a class="btn rise d3" id="download" href="https://github.com/DragonL0508/minepainter/releases/latest">
        <span>下載 Windows 版</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v13"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>
      </a>
      <div class="meta rise d4" id="meta"></div>

      <div class="links rise d5">
        <a href="https://github.com/DragonL0508/minepainter">GitHub</a> ·
        <a href="https://github.com/DragonL0508/minepainter/releases">所有版本</a>
      </div>
    </div>

    <a class="cue rise d5" href="#why">
      <span>更多</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </a>
  </section>

  <section class="why" id="why">
    <div class="reveal">
      <div class="eyebrow">WHY</div>
      <h2>就像是熟悉的 paint.net。<br />但多了這些。</h2>
      <p class="why-note">為了縮圖製作者而煎的一顆荷包蛋。</p>
    </div>
    <ul class="list">
      <li class="reveal"><i>01</i><b>快速</b><span>優化使用流程，省去多餘時間</span></li>
      <li class="reveal"><i>02</i><b>效能</b><span>開得更快，隨時隨地想做就做</span></li>
      <li class="reveal"><i>03</i><b>介面</b><span>現代設計，動畫絲滑流暢</span></li>
      <li class="reveal"><i>04</i><b>可塑</b><span>特效再也不綁死圖層，隨時能改先前的設計</span></li>
      <li class="reveal"><i>05</i><b>功能</b><span>更多功能，創作不再受限</span></li>
      <li class="reveal"><i>06</i><b>安裝</b><span>解壓就能跑，開源免費</span></li>
    </ul>
  </section>
</main>

<script>
// 下載連結直接指向「最新的 Release」附件：發一版 Release 這頁就跟著更新，不必改網頁。
(async () => {
  const repo = 'DragonL0508/minepainter';
  const size = b => (b / 1048576).toFixed(0) + ' MB';
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`);
    if (!res.ok) throw new Error(res.status);
    const rel = await res.json();
    const sc = (rel.assets || []).find(a => /win-x64\.zip$/i.test(a.name));
    if (sc) document.getElementById('download').href = sc.browser_download_url;
    const date = new Date(rel.published_at).toLocaleDateString('zh-TW');
    document.getElementById('meta').textContent = [rel.tag_name, sc && size(sc.size), `${date} 更新`].filter(Boolean).join(' · ');
  } catch {
    // 查不到（沒發過 Release、API 額度用完、離線…）就維持指向 releases/latest 的保底連結
  }
})();

// 第二頁的內容捲到才浮現；不支援 IntersectionObserver（或使用者關掉動畫）就直接顯示。
(() => {
  const items = document.querySelectorAll('.reveal');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still || !('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px' });
    items.forEach((el, i) => {
      el.style.transitionDelay = `${Math.min(i, 6) * 60}ms`;
      io.observe(el);
    });
  }

  // 捲一下就把「憑什麼」的提示收起來
  const onScroll = () => document.body.classList.toggle('scrolled', scrollY > 40);
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
